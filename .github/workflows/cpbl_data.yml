name: CPBL 데이터 자동 수집

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch_cpbl.py'
      - 'tests/test_cpbl_schedule.py'
      - '.github/workflows/cpbl_data.yml'
  schedule:
    # KST 06:00 (UTC 21:00 전날) — 스케줄 + 선수 기록
    - cron: '0 21 * * *'
    # KST 12:00 (UTC 03:00) — 스케줄만
    - cron: '0  3 * * *'
    # KST 18:00 (UTC 09:00) — 스케줄만
    - cron: '0  9 * * *'
    # KST 23:30 (UTC 14:30) — 스케줄만 (경기 종료 후)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: '수집 대상 (all / stats / schedule)'
        required: false
        default: 'all'
      year:
        description: '시즌 연도 (비우면 올해)'
        required: false
        default: ''

jobs:
  # 2026 포스트시즌/비시즌: 수집 실패(선수 페이지 404)가 지속되어 2027-04-01 전까지 자동 실행(schedule/push) 스킵.
  # 수동 실행(workflow_dispatch)은 항상 허용. 재개는 날짜 경과로 자동 처리.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y%m%d)" -ge 20270401 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "비시즌 스킵 (2027-04-01부터 자동 재개)"
          fi

  fetch:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: CPBL 수집 회귀 검사
        run: python3 -m unittest discover -s tests -v

      - name: CPBL 스케줄 수집
        if: ${{ github.event.inputs.target != 'stats' }}
        run: |
          python3 scripts/fetch_cpbl.py --schedule --year ${{ github.event.inputs.year || '0' }}


      - name: CPBL 선수 기록 수집
        if: >
          github.event.inputs.target == 'all' ||
          github.event.inputs.target == 'stats' ||
          (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *')
        run: |
          python3 scripts/fetch_cpbl.py --stats --year ${{ github.event.inputs.year || '0' }}

      - name: 변경사항 커밋
        # 검증된 일정·순위는 독립적으로 게시한다. 선수 기록 실패는 job 실패로 남긴다.
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: CPBL 데이터 자동 업데이트 $(date +'%Y-%m-%d %H:%M KST' -d '+9 hours')"
            git push
          fi
